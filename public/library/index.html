<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Library</title>
<link rel="icon" type="image/png" href="/jm-logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f2; --fg:#16161a; --muted:#6b6b73; --card:#ffffff; --line:#e4e2dc; --accent:#16161a; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f0f11; --fg:#f2f2f3; --muted:#9a9aa3; --card:#18181b; --line:#2a2a2f; --accent:#f2f2f3; --accent-fg:#0f0f11; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1180px; margin:0 auto; padding:40px 16px 80px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; }
  h1 { font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .count { color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 14px 34px -18px rgba(0,0,0,.35); }
  .thumb { position:relative; aspect-ratio:16/10; background:#000 center/cover no-repeat; }
  .dur { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff; font-size:12px; font-weight:600; padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums; }
  .body { padding:12px 14px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .t { font-weight:600; font-size:15px; line-height:1.3; }
  .d { color:var(--muted); font-size:13px; margin-top:3px; }
  .copy { flex:none; border:1px solid var(--line); background:transparent; color:var(--fg); font:500 12px Inter, sans-serif; padding:6px 10px; border-radius:999px; cursor:pointer; }
  .copy:hover { background:var(--bg); }
  .gate { max-width:380px; margin:18vh auto 0; text-align:center; }
  .gate p { color:var(--muted); font-size:14px; }
  .gate form { display:flex; gap:8px; margin-top:16px; }
  .gate input { flex:1; min-width:0; padding:11px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:14px Inter, sans-serif; }
  .gate button { padding:11px 18px; border-radius:999px; border:0; background:var(--accent); color:var(--accent-fg); font:600 14px Inter, sans-serif; cursor:pointer; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const app = document.getElementById('app');
  const fmt = (t) => { t = Math.round(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function getKey() {
    const params = new URLSearchParams(location.search);
    let key = params.get('key');
    try { if (key) localStorage.setItem('clipKey', key); else key = localStorage.getItem('clipKey'); } catch (e) {}
    if (params.has('key')) history.replaceState(null, '', location.pathname);
    return key;
  }

  function gate(msg) {
    app.innerHTML = `<div class="gate"><h1>Library</h1><p>${msg || 'Enter your key to see every clip.'}</p>
      <form id="f"><input id="k" type="password" placeholder="Key" autocomplete="current-password"><button>Open</button></form></div>`;
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault();
      try { localStorage.setItem('clipKey', document.getElementById('k').value.trim()); } catch (err) {}
      load();
    };
  }

  async function load() {
    const key = getKey();
    if (!key) return gate();
    const r = await fetch('/api/library', { headers: { Authorization: 'Bearer ' + key } }).catch(() => null);
    if (!r || !r.ok) { try { localStorage.removeItem('clipKey'); } catch (e) {} return gate('That key didn’t work.'); }
    const { clips } = await r.json();
    const cards = clips.map((c) => {
      const date = new Date(c.created).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      return `<a class="card" href="/${c.slug}">
        <div class="thumb" style="background-image:url('/v/${c.slug}/poster.jpg')"><span class="dur">${fmt(c.secs)}</span></div>
        <div class="body"><div><div class="t">${esc(c.title)}</div><div class="d">${date}</div></div>
        <button class="copy" data-slug="${c.slug}">Copy link</button></div></a>`;
    }).join('');
    app.innerHTML = `<header><h1>Library</h1><span class="count">${clips.length} clip${clips.length === 1 ? '' : 's'}</span></header>
      ${clips.length ? `<div class="grid">${cards}</div>` : '<p class="empty">No clips yet.</p>'}`;
    app.querySelectorAll('.copy').forEach((b) => b.onclick = async (e) => {
      e.preventDefault();
      try { await navigator.clipboard.writeText(location.origin + '/' + b.dataset.slug); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy link', 1500); } catch (err) {}
    });
  }
  load();
</script>
</body>
</html>
