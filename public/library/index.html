<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Library</title>
<link rel="icon" type="image/png" href="/jm-logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f2; --fg:#16161a; --muted:#6b6b73; --card:#ffffff; --line:#e4e2dc; --accent:#16161a; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f0f11; --fg:#f2f2f3; --muted:#9a9aa3; --card:#18181b; --line:#2a2a2f; --accent:#f2f2f3; --accent-fg:#0f0f11; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1180px; margin:0 auto; padding:40px 16px 80px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; }
  h1 { font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .count { color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 14px 34px -18px rgba(0,0,0,.35); }
  .thumb { position:relative; aspect-ratio:16/10; background:#000 center/cover no-repeat; }
  .dur { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff; font-size:12px; font-weight:600; padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums; }
  .body { padding:12px 14px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .t { font-weight:600; font-size:15px; line-height:1.3; }
  .d { color:var(--muted); font-size:13px; margin-top:3px; }
  .copy { flex:none; border:1px solid var(--line); background:transparent; color:var(--fg); font:500 12px Inter, sans-serif; padding:6px 10px; border-radius:999px; cursor:pointer; }
  .copy:hover { background:var(--bg); }
  .btns { flex:none; display:flex; gap:6px; }
  .vis.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .lock { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff; font-size:12px; font-weight:600; padding:3px 7px; border-radius:6px; }
  .gate { max-width:380px; margin:18vh auto 0; text-align:center; }
  .gate p { color:var(--muted); font-size:14px; }
  .gate form { display:flex; gap:8px; margin-top:16px; }
  .gate input { flex:1; min-width:0; padding:11px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:14px Inter, sans-serif; }
  .gate button { padding:11px 18px; border-radius:999px; border:0; background:var(--accent); color:var(--accent-fg); font:600 14px Inter, sans-serif; cursor:pointer; }
  .empty { color:var(--muted); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin:-8px 0 24px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--fg); font:500 13px Inter, sans-serif; padding:6px 12px; border-radius:999px; cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .chip .n { color:var(--muted); margin-left:4px; } .chip.on .n { color:inherit; opacity:.7; }
  .star { position:absolute; left:8px; top:8px; width:34px; height:34px; border:0; border-radius:999px; background:rgba(0,0,0,.55); color:#fff; font-size:18px; line-height:34px; cursor:pointer; padding:0; }
  .star.on { color:#ffc83d; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 14px; margin-top:-4px; }
  .tag { background:var(--bg); border:1px solid var(--line); color:var(--fg); font:500 12px Inter, sans-serif; padding:3px 4px 3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:2px; }
  .tag button { border:0; background:none; color:var(--muted); cursor:pointer; font-size:14px; line-height:1; padding:0 4px; }
  .addtag { border:1px dashed var(--line); background:transparent; color:var(--muted); font:500 12px Inter, sans-serif; padding:3px 9px; border-radius:999px; cursor:pointer; }
  .tagin { font:500 12px Inter, sans-serif; padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); width:120px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const app = document.getElementById('app');
  const fmt = (t) => { t = Math.round(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function getKey() {
    const params = new URLSearchParams(location.search);
    let key = params.get('key');
    try { if (key) localStorage.setItem('clipKey', key); else key = localStorage.getItem('clipKey'); } catch (e) {}
    if (params.has('key')) { params.delete('key'); history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '')); }
    return key;
  }

  function gate(msg) {
    app.innerHTML = `<div class="gate"><h1>Library</h1><p>${msg || 'Enter your key to see every clip.'}</p>
      <form id="f"><input id="k" type="password" placeholder="Key" autocomplete="current-password"><button>Open</button></form></div>`;
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault();
      try { localStorage.setItem('clipKey', document.getElementById('k').value.trim()); } catch (err) {}
      load();
    };
  }

  async function load() {
    const key = getKey();
    if (!key) return gate();
    const r = await fetch('/api/library', { headers: { Authorization: 'Bearer ' + key } }).catch(() => null);
    if (!r || !r.ok) { try { localStorage.removeItem('clipKey'); } catch (e) {} return gate('That key didn’t work.'); }
    // Private clips play only for the owner; the cookie lets the video and page requests prove it.
    document.cookie = 'clipKey=' + encodeURIComponent(key) + '; Path=/; Max-Age=31536000; SameSite=Lax; Secure';
    const { clips } = await r.json();
    const auth = { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' };
    const bySlug = Object.fromEntries(clips.map((c) => [c.slug, c]));
    let filter = 'all';
    try { filter = localStorage.getItem('libFilter') || 'all'; } catch (e) {}
    const urlTag = new URLSearchParams(location.search).get('tag');
    if (urlTag) filter = urlTag === 'favorites' ? 'fav' : 'tag:' + urlTag.toLowerCase();
    const save = (slug, body) => fetch('/api/organize', { method: 'POST', headers: auth, body: JSON.stringify({ slug, ...body }) }).then((r) => r.ok).catch(() => false);
    const shown = () => clips.filter((c) => filter === 'all' || (filter === 'fav' ? c.fav : c.tags.includes(filter.slice(4))));

    function render() {
      const tagCount = {};
      clips.forEach((c) => c.tags.forEach((t) => tagCount[t] = (tagCount[t] || 0) + 1));
      const tags = Object.keys(tagCount).sort();
      if (filter.startsWith('tag:') && !tagCount[filter.slice(4)]) filter = 'all';
      const favN = clips.filter((c) => c.fav).length;
      const chip = (id, label, n) => `<button class="chip${filter === id ? ' on' : ''}" data-f="${esc(id)}">${label}<span class="n">${n}</span></button>`;
      const list = shown();
      const cards = list.map((c) => {
        const date = new Date(c.created).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        return `<a class="card" href="/${c.slug}" data-card="${c.slug}">
          <div class="thumb" style="background-image:url('/v/${c.slug}/poster.jpg')"><button class="star${c.fav ? ' on' : ''}" data-star="${c.slug}" title="${c.fav ? 'Remove from favorites' : 'Add to favorites'}">${c.fav ? '★' : '☆'}</button>${c.private ? '<span class="lock">🔒 Private</span>' : ''}<span class="dur">${fmt(c.secs)}</span></div>
          <div class="body"><div><div class="t">${esc(c.title)}</div><div class="d">${date}</div></div>
          <div class="btns"><button class="copy vis${c.private ? ' on' : ''}" data-slug="${c.slug}" title="Public: anyone with the link. Private: only you.">${c.private ? 'Private' : 'Public'}</button>
          <button class="copy" data-slug="${c.slug}" data-copy>Copy link</button></div></div>
          <div class="tags">${c.tags.map((t) => `<span class="tag">${esc(t)}<button data-untag="${esc(t)}" title="Remove tag">×</button></span>`).join('')}<button class="addtag" data-addtag>+ Tag</button></div></a>`;
      }).join('');
      app.innerHTML = `<header><h1>Library</h1><span class="count">${list.length} of ${clips.length} clip${clips.length === 1 ? '' : 's'}</span></header>
        <div class="bar">${chip('all', 'All', clips.length)}${chip('fav', '★ Favorites', favN)}${tags.map((t) => chip('tag:' + t, '#' + esc(t), tagCount[t])).join('')}</div>
        <datalist id="alltags">${tags.map((t) => `<option value="${esc(t)}">`).join('')}</datalist>
        ${list.length ? `<div class="grid">${cards}</div>` : '<p class="empty">No clips here yet.</p>'}`;
      bind();
    }

    function bind() {
      app.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { filter = b.dataset.f; try { localStorage.setItem('libFilter', filter); } catch (e) {} render(); });
      app.querySelectorAll('[data-star]').forEach((b) => b.onclick = async (e) => {
        e.preventDefault(); e.stopPropagation();
        const c = bySlug[b.dataset.star]; c.fav = !c.fav; render();
        if (!(await save(c.slug, { fav: c.fav }))) { c.fav = !c.fav; render(); }
      });
      app.querySelectorAll('[data-untag]').forEach((b) => b.onclick = async (e) => {
        e.preventDefault(); e.stopPropagation();
        const c = bySlug[b.closest('[data-card]').dataset.card], before = c.tags;
        c.tags = c.tags.filter((t) => t !== b.dataset.untag); render();
        if (!(await save(c.slug, { tags: c.tags }))) { c.tags = before; render(); }
      });
      app.querySelectorAll('[data-addtag]').forEach((b) => b.onclick = (e) => {
        e.preventDefault(); e.stopPropagation();
        const c = bySlug[b.closest('[data-card]').dataset.card];
        const input = document.createElement('input');
        input.className = 'tagin'; input.placeholder = 'tag, tag…'; input.setAttribute('list', 'alltags');
        b.replaceWith(input); input.focus();
        input.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
        let done = false;
        const commit = async () => {
          if (done) return; done = true;
          const add = input.value.split(',').map((t) => t.replace(/\s+/g, ' ').trim().toLowerCase()).filter(Boolean);
          if (!add.length) return render();
          const before = c.tags; c.tags = [...new Set([...c.tags, ...add])]; render();
          if (!(await save(c.slug, { tags: c.tags }))) { c.tags = before; render(); }
        };
        input.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); } else if (ev.key === 'Escape') { done = true; render(); } };
        input.onblur = commit;
      });
      app.querySelectorAll('.vis').forEach((b) => b.onclick = async (e) => {
        e.preventDefault(); e.stopPropagation();
        const c = bySlug[b.dataset.slug], on = !c.private;
        b.disabled = true;
        const r = await fetch('/api/visibility', { method: 'POST', headers: auth, body: JSON.stringify({ slug: c.slug, private: on }) }).catch(() => null);
        b.disabled = false;
        if (r && r.ok) { c.private = on; render(); }
      });
      app.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async (e) => {
        e.preventDefault(); e.stopPropagation();
        try { await navigator.clipboard.writeText(location.origin + '/' + b.dataset.slug); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy link', 1500); } catch (err) {}
      });
    }
    render();
  }
  load();
</script>
</body>
</html>
